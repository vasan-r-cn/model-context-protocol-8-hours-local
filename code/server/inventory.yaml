# Lab inventory — the single place device facts live.
#
# GENERATED FROM custom-underlay.yaml. Do not hand-edit; re-generate instead.
# WHICH DEVICE SHOULD I USE?  ->  docs/lab-device-map.md
#
# ADDRESSING — this is the part that bites.
# Each VM has three kinds of address, and only one of them is useful here:
#   * 192.168.116.x  — the HYPERVISOR's management address (`mg_ipaddress`).
#     Identical across all of a VM's interfaces, reachable from the SDCloud
#     host, NOT from inside the topology. Do not put these in `host:`.
#   * 172.18.x.x     — the transport/underlay side (SD-WAN WAN interfaces,
#     the controllers, cclorchestrator). Reachable from the underlay.
#   * 10.x.x.x       — the site LAN side. This is what a participant desktop
#     reaches over the overlay/MPLS, so it is what `host:` uses below.
#
# If the MCP server is run somewhere other than a participant desktop, the
# right address may differ — override per device without editing this file:
#     export MCP_DEV_SDCEIGHTKV24_HOST=172.18.4.2
# (MCP_DEV_<NAME>_HOST | _USER | _PASSWORD | _SECRET)
#
# role drives the safety model:
#   production   read-only; written to ONLY by promote_change
#   prod-rep     the validation target — student config writes land here
#   branch, legacy   read-only
#
# Credentials differ per platform (NX-OS admin/cisco, SD-WAN edges
# admin/admin123, legacy c8000v admin/admin). Throwaway sandbox values.

devices:

  # ---- DC — production ----------------------------------
  cisconexusnkv12:
    host: 10.2.0.2
    device_type: cisco_nxos
    os: nxos
    role: production
    site: DC
    username: admin
    password: cisco
    notes: "DC aggregation; twin of cisconexusnkv30"
    # interfaces: Ethernet1/1=10.2.0.2, Ethernet1/2=10.2.1.1, Ethernet1/3=10.2.2.1
    # hypervisor mgmt 192.168.116.19 (host-only), ssh nat 20005
